[profile.default]
src = "contracts/src"
test = "test/contracts"
out = "contracts/out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Deterministic: never silently resolve a different pin.
auto_detect_solc = false
fs_permissions = [{ access = "read", path = "./fixtures" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256
